<!DOCTYPE html>
<html lang="pt-br">
<!-- =============================================================================
🏨 HOTEL CARIBE AZUL - PÁGINA DE CONSULTA DE CLIENTES
💡 Objetivo: permitir que o usuário procure clientes cadastrados no sistema.
📘 O backend Flask retorna os dados do Excel (.xlsx) e o JS exibe tudo em tabela.
🎓 Feito para demonstrar integração front-end (HTML + JS) com back-end (Python Flask)
============================================================================= -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="assets/js/main.js" defer></script>
    
</head>

<body>

    <nav>
        <div>
            <a href="/">🏨 Hotel Guido</a>

            <button type="button">
                <span></span>
            </button>

            <div id="navbarNav">
                <ul>
                    <li>
                        <a href="/">🏠 Cadastro</a>
                    </li>
                    <li>
                        <a href="/consulta">🔍 Consultar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div>
        <h2>🔍 Consulta de Clientes</h2>

        <div>
            <input type="text" id="campoBusca" placeholder="Digite o nome do cliente">
            <button id="btnBuscar" class="btn-primary">Buscar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            
            <tbody id="tabelaResultados"></tbody>
        </table>
    </div>

    <footer>
        <p>Sistema de Cadastro | Desenvolvido para fins didáticos</p>
    </footer>
</body>

</html>
