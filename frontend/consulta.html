<!DOCTYPE html>
<html lang="pt-br">
<!-- =============================================================================
🏨 HOTEL CARIBE AZUL - PÁGINA DE CONSULTA DE CLIENTES
💡 Objetivo: permitir que o usuário procure clientes cadastrados no sistema.
📘 O backend Flask retorna os dados do Excel (.xlsx) e o JS exibe tudo em tabela.
🎓 Feito para demonstrar integração front-end (HTML + JS) com back-end (Python Flask)
============================================================================= -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Consulta de Clientes</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="assets/js/main.js" defer></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient">
        <div class="container-fluid">

            <a href="/" class="navbar-brand fw-bold text-white">🏨 Hotel Caribe Azul</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="/" class="nav-link text-white">🏠 Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a href="/consulta" class="nav-link active text-white">🔍 Consultar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        
        <h2 class="text-center mb-4">🔍 Consulta de Clientes</h2>

        <!-- Barra de Busca -->
        <div class="p-3 rounded bg-light shadow mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-9">
                    <input type="text" id="campoBusca" class="form-control" placeholder="Digite o nome do cliente">
                </div>
                <div class="col-md-3 text-center">
                    <button id="btnBuscar" class="btn btn-primary w-100">Buscar</button>
                </div>
            </div>
        </div>

        <!-- Tabela de Resultados -->
        <div class="table-responsive p-3 rounded bg-light shadow">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaResultados">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>

    </main>

    <div id="mensagem" class="mt-3 text-center fw-bold"></div>

    <footer>
        <p>Sistema de Cadastro | Desenvolvido para fins didáticos</p>
    </footer>
</body>

</html>
