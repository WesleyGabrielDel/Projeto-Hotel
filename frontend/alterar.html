<!DOCTYPE html>
<html lang="pt-br">

<!-- =============================================================================
🏨 HOTEL CARIBE AZUL - PÁGINA DE ALTERAÇÃO DE DADOS
💡 Objetivo: permitir editar informações de um cliente já cadastrado.
📘 O sistema busca os dados via ID, preenche o formulário automaticamente
    e envia as alterações ao backend Flask, que atualiza o Excel (.xlsx).
🎓 Didático: feito para alunos compreenderem a integração HTML + JS + Flask.
============================================================================= -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Dados do Cliente</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="assets/js/main.js" defer></script>
</head>

<body>

    <!-- =============================================================================
    🔹 MENU SUPERIOR (NAVBAR)
    -----------------------------------------------------------------------------
    💡 Permite navegar entre as rotas Flask:
       ➜ "/" (Cadastro)
       ➜ "/consulta" (Consulta)
    ============================================================================= -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient">
        <div class="container-fluid">
            <a href="/" class="navbar-brand fw-bold text-white">🏨 Hotel Caribe Azul</a>

            <!-- 📱 Botão do menu para telas pequenas -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- 🧭 Itens do menu -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="/" class="nav-link text-white">🏠 Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a href="/consulta" class="nav-link text-white">🔍 Consultar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- =============================================================================
    🧾 FORMULÁRIO DE ALTERAÇÃO
    -----------------------------------------------------------------------------
    💡 O formulário será automaticamente preenchido pelo JS (main.js),
       que obtém os dados do cliente pelo ID na URL:
       ➜ /alterar?id=3
    ⚙️ Ao clicar em “Salvar Alterações”, o JS envia os novos dados
       via POST para a rota Flask:
       ➜ /api/atualizar/<id>
    ============================================================================= -->
    <main class="container mt-4">
        <h2 class="text-center mb-4">✏️ Alterar Dados do Cliente</h2>

        <!-- Formulário principal -->
        <form id="formAlterar" class="p-3 rounded bg-light shadow">
            <!-- Campo oculto: ID do cliente -->
            <input type="hidden" id="clienteId">

            <div class="row g-3">
                <!-- Campo Nome -->
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>

                <!-- Campo CPF -->
                <div class="col-md-6">
                    <label for="cpf" class="form-label">CPF:</label>
                    <input type="text" id="cpf" class="form-control" required>
                </div>

                <!-- Campo Email -->
                <div class="col-md-6">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <!-- Campo Telefone -->
                <div class="col-md-6">
                    <label for="telefone" class="form-label">Telefone:</label>
                    <input type="text" id="telefone" class="form-control" required>
                </div>

                <!-- Campo Endereço -->
                <div class="col-12">
                    <label for="endereco" class="form-label">Endereço:</label>
                    <input type="text" id="endereco" class="form-control" required>
                </div>

                <!-- Campo Observações -->
                <div class="col-12">
                    <label for="observacoes" class="form-label">Observações:</label>
                    <textarea id="observacoes" class="form-control" rows="2"></textarea>
                </div>

                <!-- Botão de Salvar -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary px-5">💾 Salvar Alterações</button>
                </div>
            </div>
        </form>

        <!-- Mensagem de confirmação (sucesso ou erro) -->
        <div id="mensagem" class="mt-3 text-center fw-bold"></div>
    </main>

    <!-- =============================================================================
    ⚙️ SCRIPTS JAVASCRIPT
    -----------------------------------------------------------------------------
    💡 O main.js controla:
       - O preenchimento automático dos campos ao abrir a página
       - O envio das alterações ao servidor Flask
       - As mensagens de sucesso/erro
    ============================================================================= -->
    <footer>
        <p>Sistema de Cadastro | Desenvolvido para fins didáticos</p>
    </footer>
</body>

</html>
