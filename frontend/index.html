<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Clientes</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="assets/js/main.js" defer></script>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient">
        <div class="container-fluid">

            <a href="/" class="navbar-brand fw-bold text-white">🏨 Hotel Caribe Azul</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="/" class="nav-link active text-white">🏠 Cadastro</a>
                    </li>
                    <li>
                        <a href="/consulta" class="nav-link text-white">🔍 Consultar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header>
        <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="assets/images/banner1.png" alt="Banner 1" class="d-block w-100">
                </div>

                <div class="carousel-item">
                    <img src="assets/images/banner2.png" alt="Banner 2" class="d-block w-100">
                </div>

                <div class="carousel-item">
                    <img src="assets/images/banner3.png" alt="Banner 3" class="d-block w-100">
                </div>

            </div>

        </div>
    </header>

    <main class="container mt-4">

        <h2 class="text-center mb-4">Cadastro de Clientes</h2>

        <form id="formCadastro" class="p-3 rounded bg-light shadow">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label"> Nome:</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="cpf" class="form-label"> CPF:</label>
                    <input type="text" name="cpf" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label"> Email:</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="telefone" class="form-label"> Telefone:</label>
                    <input type="text" name="telefone" class="form-control" required>
                </div>

                <div class="col-12">
                    <label for="endereco" class="form-label"> Endereço:</label>
                    <input type="text" name="endereco" class="form-control" required>
                </div>

                <div class="col-12">
                    <label for="observacao" class="form-label"> Observação:</label>
                    <textarea type="text" name="observacao" class="form-control" rows="2" required> </textarea>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class=" btn btn-primary px-5">Cadastrar</button>
                </div>

            </div>
        </form>
    </main>

    <div id="mensagem" class="mt-3 text-center fw-bold"></div>
    <footer>
        <p>Sistema de Cadastro | Desenvolvido para fins didáticos</p>
    </footer>
</body>

</html>
